[project]
name = "pnx"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pillow>=13.0.0,<14",
    "pypdf>=7.1.1,<8",
    "requests>=2.34.2,<3",
    "urllib3>=2.8.0,<3",
]

[tool.deptry]
known_first_party = ["intelligence", "mon"]

[tool.deptry.package_module_name_map]
pillow = "PIL"

[tool.ruff]
extend-exclude = [
    "src/mon/tests",
    "src/intelligence/tests",
]

[tool.basedpyright]
failOnWarnings = false
include = ["src"]
exclude = [
    "src/mon/tests",
    "src/intelligence/tests",
]
