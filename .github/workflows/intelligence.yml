name: Data Sync

# Independent workflow for the record collection package.
# It does not touch the procurement workflow (sync.yml) or src/mon.
#
# Scheduled runs apply updates to enabled sources. Manual runs default to preview.

on:
  schedule:
    - cron: '50 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        type: choice
        options:
          - inspect
          - preview
          - apply
          - images-preview
          - images-apply
          - diagnose-news
        default: preview
      preview_source:
        description: 'Optional source code to test in preview, including a disabled source'
        type: string
      from_date:
        description: 'First news replay date in Brasília (YYYY-MM-DD)'
        type: string
      through_date:
        description: 'Last news replay date in Brasília, inclusive (YYYY-MM-DD)'
        type: string
      image_limit:
        description: 'Maximum records per image backfill (1 to 500)'
        type: number
        default: 100
      image_after_id:
        description: 'Resume image backfill after this record ID'
        type: number
        default: 0

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnose-news' && 'data-sync-diagnostics' || 'data-sync-main' }}
  cancel-in-progress: false

jobs:
  sync:
    name: Record Validation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.8'
          python-version: '3.15.2'

      - name: Tests
        env:
          PYTHONPATH: src
        run: uv run --locked python -m unittest discover -s src/intelligence/tests -v

      - name: Compare government HTTPS transports
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnose-news'
        env:
          PYTHONPATH: src
        run: timeout 2m uv run --locked python -m intelligence.probe_news

      - name: Run
        env:
          PYTHONPATH: src
          MODE: ${{ github.event_name == 'schedule' && 'apply' || inputs.mode }}
          PREVIEW_SOURCE: ${{ inputs.preview_source }}
          FROM_DATE: ${{ inputs.from_date }}
          THROUGH_DATE: ${{ inputs.through_date }}
          IMAGE_LIMIT: ${{ inputs.image_limit }}
          IMAGE_AFTER_ID: ${{ inputs.image_after_id }}
          INTEL_AVATAR_FIELD: ${{ secrets.INTEL_AVATAR_FIELD }}
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
        run: |
          args=("$MODE" --summary-only)
          if [[ -n "$PREVIEW_SOURCE" ]]; then
            args+=(--preview-source "$PREVIEW_SOURCE")
          fi
          if [[ -n "$FROM_DATE" || -n "$THROUGH_DATE" ]]; then
            args+=(--from-date "$FROM_DATE" --through-date "$THROUGH_DATE")
          fi
          if [[ "$MODE" == images-* ]]; then
            args+=(--limit "$IMAGE_LIMIT" --after-id "$IMAGE_AFTER_ID")
          fi
          timeout --kill-after=30s 50m uv run --locked python -u -m intelligence "${args[@]}"
