name: pnx

on:
  schedule:
    - cron: '0 9,16 * * *'
      timezone: America/Sao_Paulo

  workflow_dispatch:
    inputs:
      mode:
        description: 'sync'
        type: choice
        options:
          - preview
          - inspect
          - apply
        default: preview

permissions:
  contents: read

concurrency:
  group: pncp-sync-main
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_COLLECT == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 175

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.8'
          python-version: '3.15.2'

      - name: Tests
        env:
          PYTHONPATH: src
        run: uv run --locked python -m unittest discover -s src/tests -v

      - name: collect
        env:
          PNCP_INITIAL_DATE: ${{ vars.PNCP_INITIAL_DATE }}
          PYTHONPATH: src
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (vars.ENABLE_SYNC == 'true' && 'apply' || 'preview') }}
          ODOO_URL: ${{ secrets.ODOO_URL }}
          ODOO_DATABASE: ${{ vars.ODOO_DATABASE }}
          ODOO_PROJECT_ID: ${{ vars.ODOO_PROJECT_ID }}
          ODOO_STAGE_ID: ${{ vars.ODOO_STAGE_ID }}
          ODOO_PNCP_FIELD: ${{ vars.ODOO_PNCP_FIELD }}
          ODOO_CHECKPOINT_FIELD: ${{ vars.ODOO_CHECKPOINT_FIELD }}
          ODOO_FIELD_MAP: ${{ vars.ODOO_FIELD_MAP }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          PNCP_FILTERS_JSON: ${{ secrets.PNCP_FILTERS_JSON }}
          ODOO_ALLOW_UNLINKED_TASKS: ${{ vars.ODOO_ALLOW_UNLINKED_TASKS }}
        run: timeout --kill-after=30s 150m uv run --locked python -u -m mon "$MODE"

